plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bombblast.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.bombblast.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        debugStable {
            // Stable key shared across all CI runs: every build signs with the
            // same key, so new APKs install as clean updates over older ones
            // instead of failing with an INSTALL signature-conflict error.
            // NOTE: signingConfigs must come before buildTypes (Gradle
            // evaluates the android block top-down).
            storeFile file('../debug.keystore')
            storePassword 'android'
            storeType 'PKCS12'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debugStable
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Single source of truth: copy the web game into assets before every build
tasks.register('copyWebAssets', Copy) {
    from '../../www'
    into 'src/main/assets/www'
}
tasks.named('preBuild') { dependsOn 'copyWebAssets' }
